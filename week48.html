:root{--ink:#24304b;--cream:#fffaf0;--yellow:#ffd36c;--purple:#7660db;--pink:#ff8b9a;--mint:#7bd9b2;--blue:#83c9ef}*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#f7f1e7;background-image:radial-gradient(#e8dccc 1px,transparent 1px);background-size:23px 23px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #f7b945;outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:24px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-family:Fredoka,sans-serif;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}.logo span{background:var(--purple);color:white;border-radius:13px;padding:8px 11px;box-shadow:0 5px 0 #5544aa}.smallpill{background:#fff;border:2px solid #e9dfd4;border-radius:30px;padding:9px 16px;font-weight:900}.hero{background:#282f58;color:white;border-radius:32px;padding:46px 44px;position:relative;overflow:hidden;margin-top:25px;box-shadow:0 12px 0 #ded2c5;min-height:295px}.hero:before{content:'';position:absolute;width:390px;height:390px;border:2px dashed #ffffff30;border-radius:50%;right:-85px;top:-90px}.eyebrow{font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#ffd36c;font-size:13px}.hero h1{font-family:Fredoka,sans-serif;font-size:clamp(40px,6vw,72px);line-height:1.05;margin:15px 0}.hero p{font-size:18px;max-width:550px;color:#e6e5fa}.heroart{position:absolute;right:55px;top:65px;font-size:100px;transform:rotate(-12deg);filter:drop-shadow(8px 10px 0 #171b3c)}.heroart i{font-style:normal;font-size:60px;position:absolute;left:90px;top:80px}.sectiontitle{font-family:Fredoka,sans-serif;font-size:29px;margin:38px 0 8px}.muted{color:#7d8190}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}.mode{border:2px solid #e8e0d8;text-align:left;background:#fff;border-radius:23px;padding:24px;box-shadow:0 6px 0 #e5dbce;transition:transform .1 :hover{filter:brightness(1.07)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#fff;border:2px solid #ddd7e7;border-radius:15px;padding:12px 20px;font-weight:900}.entry{display:flex;gap:10px;max-width:600px;margin:25px auto;flex-wrap:wrap;justify-content:center}.entry input{min-width:200px;flex:1;padding:17px 20px;border:2px solid #dcd7e7;border-radius:15px;font-size:21px;text-align:center}.hint{color:#777f8d;font-size:14px}.flash{max-width:560px;height:260px;margin:30px auto;perspective:1000px;cursor:pointer}.flashinner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flash.flipped .flashinner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:25px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;background:#f0ebff;border:3px solid #b5a5ed}.face.backface{transform:rotateY(180deg);background:#dff7ec;border-color:#8bd8b2}.face strong{font:600 clamp(30px,5vw,48px) Fredoka;text-align:center}.face small{font-weight:900;color:#72718b;margin-bottom:20px;letter-spacing:2px}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}.memory{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin:26px auto;max-width:840px}.tile{height:108px;border:2px solid #dcd5eb;border-radius:15px;background:#f5f0ff;font-weight:900;font-size:clamp(12px,1.55vw,16px);padding:8px;overflow-wrap:anywhere}.tile.hidden{background:#7560d9;color:white;font-size:35px;border-color:#6550c8;box-shadow:0 4px 0 #4e3d9f}.tile.matched{background:#dcf8e9;border-color:#8bd5b0;color:#267857}.tile:not(.hidden):not(.matched){background:#fff3d7;border-color:#e8c86f}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.stat{background:#f8f5ef;border-radius:14px;padding:10px 17px;font-weight:900}.finish{padding:40px 10px;text-align:center}.finish .trophy{font-size:85px}.finish h2{font-size:46px}.wordlist{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.chip{padding:8px 12px;border-radius:12px;background:#fff;border:1px solid #e8e0d7;font-weight:800;font-size:13px}@media(max-width:760px){.modes{grid-template-columns:repeat(2,1fr)}.heroart{opacity:.2;right:20px}.hero{padding:35px 25px}.game{padding:18px}.memory{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{height:85px}.answers{grid-template-columns:1fr}}@media(max-width:450px){.modes{grid-template-columns:1fr}.mode{min-height:0}.memory{gap:6px}.tile{height:76px;font-size:11px;padding:3px}.tile.hidden{font-size:23px}.shell{padding:15px 12px 40px}.hero{border-radius:23px}.game h2{font-size:29px}}

/* Learn English 4 inspired visual identity: warm stripes, teal ribbon, coral lettering */
:root{--ink:#34505a;--cream:#fffaf0;--yellow:#f6c968;--purple:#318f94;--pink:#d64f72;--mint:#92c8b7;--blue:#a8d8d8}
body{background:#fff7e7;background-image:repeating-linear-gradient(0deg,#fff6df 0px,#fff6df 55px,#fff0ce 55px,#fff0ce 110px)}
.shell{max-width:1110px}.logo{font-family:Georgia,serif;color:#d45070;letter-spacing:1px;font-weight:900}.logo span:first-child{background:#3c9da0;box-shadow:0 4px 0 #237477}.bookfour{background:#e9a947;color:white;border-radius:50%;font:900 15px Nunito;padding:4px 9px;margin-left:4px}

.mode:hover{box-shadow:0 10px 0 #e5c799}.mode .emoji{background:#e4f3ee;border:3px solid #a8d8cd;border-radius:50%}.mode:nth-child(2) .emoji{background:#fff0ce;border-color:#efcc84}.mode:nth-child(3) .emoji{background:#ffe3e7;border-color:#eeb7c3}.mode:nth-child(4) .emoji{background:#e4f3ee;border-color:#a8d8cd}.mode:nth-child(5) .emoji{background:#fff0ce;border-color:#efcc84}
.mode h3{font-family:Georgia,serif;color:#328e93}.game{background:#fffdf6;border-color:#eac68f;box-shadow:0 8px 0 #e6d0a9}.back{background:#e3f3f0;color:#2a8286}.primary{background:#328f94;box-shadow:0 5px 0 #1f6e72}.secondary{border-color:#e5c28e;background:#fff9eb}.answer{background:#fff7e7;border-color:#ecd6ac}.answer:hover:not(:disabled){border-color:#328f94}.bar{background:linear-gradient(90deg,#f1c15f,#d45070,#3e9e9c)}.face{background:#fff0c9;border-color:#e7c57e}.face.backface{background:#e0f1eb;border-color:#9acdbf}.tile.hidden{background:#3e9c9e;border-color:#23777a;box-shadow:0 4px 0 #20686c}.tile{border-color:#e8c58c;background:#fff7e6}.chip{border-color:#e9c992;background:#fffaf0}.stat{background:#fff1d7}

/* Week 48: same striped textbook background and card structure as week 47,

:root{--ink:#354c53;--purple:#527c83;--pink:#c65d77;--mint:#a3c9ba;--yellow:#edcb80}
body{background-color:#fff8eb;background-image:repeating-linear-gradient(0deg,#fff8e9 0px,#fff8e9 55px,#f7e9cf 55px,#f7e9cf 110px)}
.hero{background:repeating-linear-gradient(0deg,#dce9e6 0px,#dce9e6 55px,#cbdedb 55px,#cbdedb 110px);border-color:#fff9eb;outline-color:#9abcb7;color:#b74f6c}

</style></head><body><main class="shell"><header class="top"><div class="logo"><span>🧙‍♀️</span> LEARN ENGLISH <span class="bookfour">4</span></div><div class="smallpill">🇬🇧 English · Week 48</div></header><div id="app"></div></main><script>
const words=[['letter','brev'],['fancy','skulle gilla'],['stay','stanna'],['chins','hakor'],['hug','kram'],['nearly','nästan'],['slices','skivor'],['bored','uttråkad'],['quiet','tyst'],['rest','vila']];
const modes=[['memory','🕸️','Memory','Hitta de engelska och svenska paren.'],['spell','🔮','Spelling Bee','Lyssna på ordet och stava rätt.'],['write','✒️','Write it!','Skriv den engelska översättningen.'],['flash','📜','Flashcards','Vänd korten och testa ditt minne.'],['choice','🧪','Multiple Choice','Välj rätt svar bland fyra alternativ.']];
let mode='',items=[],index=0,score=0,locked=false,flip=false,mem=[],opened=[],matched=new Set(),tries=0,memorizing=false,review=[],memoryTimer=null;const app=document.getElementById('app');const shuffle=a=>[...a].sort(()=>Math.random()-.5);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const normalize=s=>s.toLocaleLowerCase('sv').trim().replace(/\s+/g,' ').replace(/[.!?]/g,'');
function home(){mode='';app.innerHTML=`<section class="hero"><div class="eyebrow">Learn English - Unit 3 - Main text - The Sand Witch, chapter 1</div><h1>Homework<br>week 48</h1><p>The Sand Witch · Meet Drusilla, Hagbag and Peg! Practise your words from pages 42–44 and collect points.</p><div class="heroart">🧙‍♀️<i>🐈‍⬛</i></div></section><h2 class="sectiontitle">Choose your game <span>🎮</span></h2><div class="muted">Fem sätt att öva – välj det som passar dig!</div><div class="modes">${modes.map(([id,e,n,d])=>`<button class="mode" onclick="start('${id}')"><span class="emoji">${e}</span><h3>${n}</h3><p>${d}</p></button>`).join('')}</div><h2 class="sectiontitle">Your 10 words 📚</h2><div class="wordlist">${words.map(w=>`<span class="chip">${esc(w[0])} · ${esc(w[1])}</span>`).join('')}</div><p class="footer">LEARN ENGLISH 4 · Chapter 1 · The Sand Witch · Homework week 48</p>`}
function frame(name,sub){app.innerHTML=`<section class="game"><div class="gamehead"><button class="back" onclick="home()">← All games</button><div class="smallpill">⭐ <span id="score">${score}</span> points</div></div><h2>${name}</h2><div class="muted">${sub}</div><div id="body"></div></section>`}
function start(m){if(memoryTimer)clearTimeout(memoryTimer);mode=m;items=shuffle(words);review=[];index=0;score=0;locked=false;flip=false;if(m==='memory')startMemory();else render()}
function progress(){return `<div class="progress"><div class="bar" style="width:${index/words.length*100}%"></div></div><div class="muted center">${Math.min(index+1,10)} / 10 words</div>`}
function render(){if(index>=items.length){finish();return}locked=false;const w=items[index];const name={spell:'🔤 Spelling Bee',write:'✍️ Write it!',flash:'🃏 Flashcards',choice:'🎯 Multiple Choice'}[mode];frame(name,{spell:'Lyssna på det engelska ordet och skriv det.',write:'Översätt från svenska till engelska.',flash:'Fundera på svaret innan du vänder kortet.',choice:'Välj rätt svensk översättning.'}[mode]);const b=document.getElementById('body');if(mode==='choice'){const opts=shuffle([w[1],...shuffle(words.filter(x=>x!==w)).slice(0,3).map(x=>x[1])]);b.innerHTML=progress()+`<div class="center"><div class="prompt">What does this mean?</div><div class="word">${esc(w[0])}</div><div class="answers">${opts.map(x=>`<button class="answer" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="primary" onclick="next()" hidden>Next word →</button></div>`;document.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{if(locked)return;locked=true;const ok=btn.dataset.value===w[1];if(ok)score+=10;document.getElementById('score').textContent=score;document.querySelectorAll('.answer').forEach(x=>{x.disabled=true;if(x.dataset.value===w[1])x.classList.add('correct');else if(x===btn)x.classList.add('wrong')});document.getElementById('feedback').textContent=ok?'🌟 Correct! Great job!':`💡 The right answer is: ${w[1]}`;document.getElementById('next').hidden=false})}
else if(mode==='write'||mode==='spell'){const spell=mode==='spell';b.innerHTML=progress()+`<div class="center"><div class="prompt">${spell?'Listen and spell':'Translate into English'}</div>${spell?`<button class="primary" onclick="speak()">🔊 Listen to the word</button><p class="hint">Du kan lyssna flera gånger. Använd gärna hörlurar.</p>`:`<div class="word">${esc(w[1])}</div>`}<form class="entry" id="entry"><input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="Type in English..." required><button class="primary" type="submit">Check ✓</button></form><div class="feedback" id="feedback" aria-live="polite"></div><button id="next" class="primary" onclick="next()" hidden>Next word →</button></div>`;document.getElementById('entry').onsubmit=e=>{e.preventDefault();if(locked){next();return}locked=true;const ans=document.getElementById('answer');const ok=normalize(ans.value)===normalize(w[0]);if(ok)score+=10;document.getElementById('score').textContent=score;document.getElementById('feedback').textContent=ok?'🌟 Excellent! You got it!':`💡 Correct spelling: ${w[0]}`;ans.disabled=true;const checkButton=document.querySelector('#entry button');checkButton.disabled=false;checkButton.textContent='Next word →';checkButton.type='submit';document.getElementById('next').hidden=false;document.getElementById('next').focus()};document.getElementById('answer').focus()}
else if(mode==='flash'){b.innerHTML=progress()+`<div class="flash" id="flash" role="button" tabindex="0" aria-label="Flip flashcard" onclick="flipCard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();flipCard()}"><div class="flashinner"><div class="face"><small>ENGLISH</small><strong>${esc(w[0])}</strong><p>↻ Tap to flip</p></div><div class="face backface"><small>SVENSKA</small><strong>${esc(w[1])}</strong><p>✨ Nice work!</p></div></div></div><div class="controls"><button class="secondary" onclick="flipCard()">↻ Flip card</button><button class="secondary" onclick="flashRate(false)">🔁 Practice again</button><button class="primary" onclick="flashRate(true)">✓ I know it!</button></div>`}}
function speak(){if(!('speechSynthesis'in window)){alert('Din webbläsare stöder inte uppläsning.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(items[index][0]);u.lang='en-GB';u.rate=.78;speechSynthesis.speak(u)}function next(){index++;render()}function flipCard(){document.getElementById('flash').classList.toggle('flipped')}function flashRate(ok){if(ok){score+=10}else{review.push(items[index])}index++;if(index>=items.length&&review.length){items=shuffle(review);review=[];index=0}render()}
function startMemory(){if(memoryTimer)clearTimeout(memoryTimer);mem=shuffle(words.flatMap((w,i)=>[{id:i,lang:'en',text:w[0]},{id:i,lang:'sv',text:w[1]}]));opened=[];matched=new Set();tries=0;memorizing=false;drawMemory()}
function drawMemory(){frame('🧩 Memory','Hitta alla 10 par. Vänd två kort i taget!');document.getElementById('body').innerHTML=`<div class="stats"><span class="stat">🧩 Pairs: <span id="pairs">${matched.size}</span>/10</span><span class="stat">🎲 Turns: <span id="turns">${tries}</span></span></div><div class="memory">${mem.map((c,i)=>`<button class="tile ${matched.has(c.id)?'matched':'hidden'}" data-i="${i}" onclick="pick(${i})">${matched.has(c.id)?esc(c.text):'🎲'}</button>`).join('')}</div><div class="center"><button class="secondary" onclick="startMemory()">↻ Shuffle and restart</button></div>`}
function pick(i){if(memorizing||opened.includes(i)||matched.has(mem[i].id))return;opened.push(i);const el=document.querySelector(`[data-i="${i}"]`);el.classList.remove('hidden');el.textContent=mem[i].text;if(opened.length===2){tries++;document.getElementById('turns').textContent=tries;const [a,b]=opened.map(j=>mem[j]);if(a.id===b.id&&a.lang!==b.lang){matched.add(a.id);score+=10;document.getElementById('score').textContent=score;document.getElementById('pairs').textContent=matched.size;opened.forEach(j=>document.querySelector(`[data-i="${j}"]`).classList.add('matched'));opened=[];if(matched.size===10)setTimeout(()=>{if(mode==='memory')finish()},500)}else{memorizing=true;memoryTimer=setTimeout(()=>{opened.forEach(j=>{const t=document.querySelector(`[data-i="${j}"]`);if(t){t.classList.add('hidden');t.textContent='🎲'}});opened=[];memorizing=false},950)}}}
function finish(){const title=mode==='memory'?'Memory champion!':'Round complete!';frame('🏆 '+title,'You made it through your game!');document.getElementById('body').innerHTML=`<div class="finish"><div class="trophy">🏆</div><h2>Great job!</h2><p class="word">${score} points</p><p class="muted">${mode==='memory'?`You found all 10 pairs in ${tries} turns!`:'You practiced your vocabulary!'}</p><div class="controls"><button class="primary" onclick="start('${mode}')">🎲 Play again</button><button class="secondary" onclick="home()">All games →</button></div></div>`}
home();
</script></body></html>
